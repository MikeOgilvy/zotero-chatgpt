<!--
	Zotero GPT Reader preferences pane.

	The pane script owns every control so the markup stays a single native container: the root
	element dispatches load/unload in Zotero's Preferences window, and the script in this plugin
	builds the form, reads the workspace store and reports failures in place.
-->
<vbox id="zcr-prefpane-settings"
	onload="Zotero.ZoteroCodexReaderPreferencesPane.mount(this)"
	onunload="Zotero.ZoteroCodexReaderPreferencesPane.unmount(this)"
>
	<description data-zcr-pref="loading">Loading Zotero GPT Reader preferences…</description>
</vbox>
