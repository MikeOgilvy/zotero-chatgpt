<!--
	Zotero ChatGPT preferences pane.

	The pane script owns every control so the markup stays a single native container: the root
	element dispatches load/unload in Zotero's Preferences window, and the script in this plugin
	builds the form, reads the workspace store and reports failures in place.
-->
<vbox id="zchatgpt-prefpane-settings"
	onload="Zotero.ZoteroChatGPTPreferencesPane.mount(this)"
	onunload="Zotero.ZoteroChatGPTPreferencesPane.unmount(this)"
>
	<description data-zchatgpt-pref="loading">Loading Zotero ChatGPT preferences…</description>
</vbox>
