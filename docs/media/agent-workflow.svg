<?xml version="1.0" encoding="UTF-8"?>
<!--
  Agent workflow diagram for the README.

  Original artwork, drawn for this repository. Self-contained: no script, no external font, no
  remote resource, no tracking. Text uses a generic sans-serif stack so it renders with whatever
  the reader's browser already has.

  This is an illustration of how the four steps are meant to work. It is not a screenshot, and it
  is not evidence that any of these steps ran: it is deliberately labelled "Illustrated workflow",
  and the README keeps the "Agent is experimental" wording beside it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 372" width="1200" height="372"
     role="img" aria-labelledby="agent-workflow-title agent-workflow-desc">
  <title id="agent-workflow-title">Illustrated Agent workflow</title>
  <desc id="agent-workflow-desc">Four steps: Ask Agent, review the suggestions, approve the changes, then the approved changes are applied in Zotero as native highlights. Illustrated workflow, not a screenshot.</desc>

  <defs>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa3af"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="371" rx="18" fill="#ffffff" stroke="#e3e6ea"/>

  <g font-family="Helvetica, Arial, sans-serif">
    <!-- Deliberate label: this drawing explains the workflow, it does not record one. -->
    <text x="52" y="52" font-size="15" font-weight="700" letter-spacing="1.6" fill="#6b7280">ILLUSTRATED WORKFLOW</text>
    <text x="52" y="76" font-size="14" fill="#8b939f">Agent proposes; nothing reaches your library until you approve it.</text>

    <!-- Step 1 -->
    <g>
      <rect x="40" y="112" width="236" height="112" rx="14" fill="#f6f8fb" stroke="#d7dce3"/>
      <circle cx="76" cy="148" r="15" fill="#2f6fd0"/>
      <text x="76" y="153.5" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
      <text x="102" y="154" font-size="17" font-weight="600" fill="#1f2733">Ask Agent</text>
      <text x="64" y="188" font-size="14" fill="#5b6472">Describe the task for</text>
      <text x="64" y="207" font-size="14" fill="#5b6472">the open paper.</text>
    </g>
    <path d="M 284 168 L 322 168" stroke="#9aa3af" stroke-width="2" marker-end="url(#flow-arrow)"/>

    <!-- Step 2 -->
    <g>
      <rect x="335" y="112" width="236" height="112" rx="14" fill="#f6f8fb" stroke="#d7dce3"/>
      <circle cx="371" cy="148" r="15" fill="#2f6fd0"/>
      <text x="371" y="153.5" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
      <text x="397" y="154" font-size="17" font-weight="600" fill="#1f2733">Review suggestions</text>
      <text x="359" y="188" font-size="14" fill="#5b6472">See every proposed change</text>
      <text x="359" y="207" font-size="14" fill="#5b6472">before it is written.</text>
    </g>
    <path d="M 579 168 L 617 168" stroke="#9aa3af" stroke-width="2" marker-end="url(#flow-arrow)"/>

    <!-- Step 3 -->
    <g>
      <rect x="630" y="112" width="236" height="112" rx="14" fill="#f6f8fb" stroke="#d7dce3"/>
      <circle cx="666" cy="148" r="15" fill="#2f6fd0"/>
      <text x="666" y="153.5" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
      <text x="692" y="154" font-size="17" font-weight="600" fill="#1f2733">Approve changes</text>
      <text x="654" y="188" font-size="14" fill="#5b6472">You choose what to allow;</text>
      <text x="654" y="207" font-size="14" fill="#5b6472">nothing else is written.</text>
    </g>
    <path d="M 874 168 L 912 168" stroke="#9aa3af" stroke-width="2" marker-end="url(#flow-arrow)"/>

    <!-- Step 4 -->
    <g>
      <rect x="925" y="112" width="236" height="112" rx="14" fill="#eef4fd" stroke="#bcd2f0"/>
      <circle cx="961" cy="148" r="15" fill="#2f6fd0"/>
      <text x="961" y="153.5" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
      <text x="987" y="154" font-size="17" font-weight="600" fill="#1f2733">Apply in Zotero</text>
      <text x="949" y="188" font-size="14" fill="#5b6472">Approved changes go in</text>
      <text x="949" y="207" font-size="14" fill="#5b6472">via Zotero's own API.</text>
    </g>

    <text x="1043" y="252" font-size="14" font-weight="600" fill="#3d6fb5" text-anchor="middle">Highlights &#183; Tags &#183; Collections</text>

    <line x1="52" y1="288" x2="1148" y2="288" stroke="#eceff3" stroke-width="1.5"/>

    <text x="52" y="322" font-size="15" fill="#1f2733">Example request: <tspan font-style="italic" fill="#3d6fb5">&#8220;Highlight the key passages.&#8221;</tspan></text>
    <text x="52" y="348" font-size="13" fill="#8b939f">Illustration of the intended flow. The Agent is experimental; fetching open-access PDFs is still being refined.</text>
  </g>
</svg>
