name: Release dry-run

# Source-completable GitHub Actions plan only. It never creates a GitHub Release,
# never calls `gh release`, and never uploads XPI assets.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: node scripts/release.mjs --dry-run
